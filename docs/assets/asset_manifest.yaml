status: DRAFT
production_policy: scene-flow-first, scene-by-scene production
summary: >
  데모 전체 장면 흐름을 먼저 잠근 뒤, S01부터 장면 단위로 에셋 제작/구현/QA를 진행한다.
  이 문서는 현재 데모에 필요한 최소 에셋 범위와 제작 우선순위를 정의한다.

asset_gate_policy:
  visible_story_assets: ComfyUI candidate generation + contact sheet review + Ren'Py screenshot QA before promotion
  placeholders: placeholder_ok_until_scene_lock
  final_quality_claim: only after artifact review and in-game screenshot/listening QA
  local_outputs: generated outputs and review sheets stay gitignored unless explicitly promoted

