scene_by_scene_plan:
  - scene: ch01_s01_summoning_measurement
    asset_focus: [bg_summoning_hall, cg_measurement_orb, sprite_harin_neutral, sprite_harin_suspicious]
    qa: contact sheet review + Ren'Py screenshot QA
  - scene: ch01_s02_artifact_lab
    asset_focus: [bg_artifact_lab, cg_sealed_artifact, sprite_harin_neutral, sprite_harin_suspicious]
    qa: danger ramp screenshot + shutdown screenshot
  - scene: ch01_s03_special_observation
    asset_focus: [bg_report_room_or_headmaster_seal, cg_special_observation_seal]
    qa: official-document beat readability without fake text
  - scene: ch01_s04_harin_watch
    asset_focus: [bg_academy_corridor, sprite_harin_surprised]
    qa: two-person staging and choice-box overlap
  - scene: ch01_s05_demo_ending_hook
    asset_focus: [bg_academy_corridor_or_notice_board, cg_special_observation_notice]
    qa: ending hook screenshot and text readability
