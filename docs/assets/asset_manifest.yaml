      priority: P1
      production_route: ComfyUI background candidate batch, no fake text
      status: promoted_prototype_pending_in_game_qa
      selected_candidate: bg_summoning_hall_s03
      game_path: demo/game/images/backgrounds/bg_summoning_hall.png
      qa_note: docs/assets/s01_asset_candidate_qa_2026-05-12.md
    - id: bg_artifact_lab
      scenes: [ch01_s02_artifact_lab]
      purpose: 봉인 마도구가 있는 실습동/보관실
