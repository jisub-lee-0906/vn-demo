scene_id: ch01_s01_summoning_measurement
status: DRAFT
location: royal_academy_summoning_hall
characters:
  - protagonist_seojin
  - harin
  - students_chorus
  - professor
scene_purpose: >
  이세계 왕립 마법 학원에 전이된 주인공이 마력 측정구 오류로
  “측정 불능의 대현자 후보”라는 첫 착각을 얻는다.
emotion_start: 혼란, 낯선 공간, 생존 본능
emotion_end: 명성 상승, 하린의 의심, 특별 관찰 떡밥
protagonist_actual_intent:
  - 상황을 파악하고 싶다.
  - 튀지 않고 안전하게 넘어가고 싶다.
  - 측정구가 뭔지 몰라 시키는 대로 할 뿐이다.
surrounding_misinterpretation:
  - 침묵은 위엄과 계산으로 해석된다.
  - 모른다는 말은 정체를 감추는 말로 해석된다.
  - 재측정은 학원의 측정 체계에 대한 도전으로 해석된다.
required_events:
  - 주인공이 낯선 강당에서 깨어난다.
  - 교수/학생들이 편입생 측정을 요구한다.
  - 측정구가 “측정 불능” 반응을 낸다.
  - 하린이 학생회 감찰 담당으로 등장해 주인공을 의심한다.
  - 첫 선택지가 reputation / misunderstanding_score / harin_suspicion에 영향을 준다.
  - 봉인 마도구 실습실 이동을 다음 장면 후크로 남긴다.
choices:
  - id: silent
    text: 침묵한다
    effect:
      misunderstanding_score: +1
      reputation: +1
    interpretation: 모두가 힘을 숨기는 침착함으로 받아들인다.
  - id: explain
    text: 저도 잘 모르겠습니다
    effect:
      harin_suspicion: +1
      misunderstanding_score: +1
    interpretation: 하린은 너무 평범한 반응을 의심하고, 학생들은 정체 은폐로 해석한다.
  - id: retry
    text: 측정구를 다시 만져본다
    effect:
      reputation: +1
      faculty_interest: +1
      hidden_talent_hint: +1
    interpretation: 실제로는 당황한 재시도지만, 측정구가 다시 흔들리며 더 큰 오해를 만든다.
assets:
  backgrounds:
    - bg_summoning_hall_placeholder
  sprites:
    - harin_neutral_placeholder
    - harin_suspicious_placeholder
  sfx:
    - magic_pulse_placeholder
    - students_murmur_placeholder
forbidden:
  - 주인공이 자기 힘을 정확히 이해하지 않는다.
  - 하린이 바로 호감을 보이지 않는다.
  - 주인공을 완전한 먼치킨으로 확정하지 않는다.
  - 결투 사건을 첫 장면에 넣지 않는다.
qa_notes:
  - 첫 구현은 placeholder-safe 텍스트 장면으로 충분하다.
  - 배경/스프라이트는 추후 ComfyUI 산출물로 교체한다.
  - 선택지 후 변수 변화가 스크립트에 명시되어야 한다.
