scene_id: ch01_s02_artifact_lab
status: DRAFT
location: 왕립 마법 학원 실습동 - 봉인 마도구 보관실
purpose: >
  측정 불능 사건 직후 주인공이 하린의 감시를 받으며 실습동으로 이동하고,
  훈련용 봉인 마도구 폭주를 우연히 멈추면서 착각이 공식 소문으로 커지는 장면.

characters:
  - id: protagonist
    role: 평범한 전이자. 실제 의도는 위험에서 벗어나고 상황을 이해하는 것.
  - id: harin
    role: 학생회 감찰 담당. 주인공을 의심하지만 무고한 당황도 관찰한다.
  - id: professor
    role: 실습동 책임자. 사고를 공식 기록으로 남길 사람.
  - id: students
    role: 목격자. 우연한 행동을 고대 봉인식 해석으로 과대해석한다.

required_beats:
  - 강당보다 조용하고 위험한 실습동 분위기로 전환한다.
  - 하린이 주인공에게 측정 불능의 의미를 압박하듯 묻는다.
  - 봉인 마도구가 오작동하고 안전선이 희미하게 드러난다.
  - 주인공은 겁먹은 회피/생존 행동을 하지만, 주변은 고대 봉인식 좌표 해석으로 본다.
  - 결과적으로 event_artifact_stopped가 True가 되고 특별 관찰 후크로 연결된다.

choice:
  variable: choice_artifact_action
  options:
    - text: 뒤로 물러난다.
      value: step_back
      actual_intent: 폭주하는 마도구에서 멀어지려는 생존 행동.
      outside_interpretation: 안전선을 정확히 밟아 봉인 좌표를 완성했다.
      effects:
        - clue_artifact_safety_line_seen = True
        - event_artifact_stopped = True
        - misunderstanding_score += 1
        - reputation += 1
    - text: 하린에게 피하라고 외친다.
      value: warn_harin
      actual_intent: 눈앞의 사람을 다치게 하고 싶지 않다.
      outside_interpretation: 폭주 방향을 미리 읽고 지휘했다.
      effects:
        - harin_trust += 1
        - event_artifact_stopped = True
        - reputation += 1
    - text: 바닥의 빛나는 선을 건드린다.
      value: touch_line
      actual_intent: 문처럼 보이는 빛을 더듬어 탈출구를 찾는다.
      outside_interpretation: 고대 봉인식의 잔여 회로를 직접 닫았다.
      effects:
        - hidden_talent_hint += 1
        - faculty_interest += 1
        - event_artifact_stopped = True

misunderstanding_rule: >
  주인공의 행동은 똑똑한 해결이 아니라 겁먹은 회피여야 한다. 다만 학원 기록,
  안전선, 봉인식 도식이 우연히 겹쳐져 주변 인물이 그럴듯하게 과대해석한다.

tone_guardrails:
  - 주인공을 바보로 만들지 않는다. 이세계 지식이 없고 생존 우선일 뿐이다.
  - 하린은 무조건 믿지 않는다. 신뢰가 오르더라도 의심을 남긴다.
  - 코미디 직후에도 공식 기록/파벌 견제라는 진지한 결과를 남긴다.

next_hook:
  label: ch01_s03_special_observation
  summary: 학원장이 주인공을 특별 관찰 대상으로 지정하고, 하린이 감시를 자처한다.
