scene_id: ch01_s03_special_observation
status: PLAYABLE DRAFT
location: 왕립 마법 학원 본관 - 임시 보고실
purpose: >
  측정 불능과 봉인 마도구 정지 사건을 공식 기록으로 묶고, 주인공이 특별 관찰
  대상으로 지정되는 장면. 플레이어에게 데모 후반의 외부 압박과 하린의 감시 이유를
  명확히 제시한다.

flow_position:
  previous: ch01_s02_artifact_lab
  next: ch01_s04_harin_watch
  production_policy: scene-flow-first, scene-by-scene production

characters:
  - id: protagonist
    role: 집에 가고 싶지만, 공식 절차 때문에 더 깊이 말려드는 전이자.
  - id: harin
    role: 감찰 담당. 의심과 보호 의무 사이에서 임시 감시를 신청한다.
  - id: professor
    role: 사건 보고자. 주인공의 행위를 학원장 보고 안건으로 올린다.
  - id: headmaster_voice_or_seal
    role: 직접 등장하지 않아도 되는 권위. 봉인 서류/음성/문장으로 처리 가능.
  - id: noble_faction_hint
    role: 귀족반 또는 파벌 압박의 첫 암시.

required_beats:
  - 실습동 사고 직후, 보고실로 장면을 옮겨 공식 절차의 무게를 만든다.
  - 교수는 측정 불능과 봉인 마도구 정지를 하나의 사건으로 기록한다.
  - 하린은 주인공이 악의적이지 않을 가능성을 보지만, 혼자 두면 위험하다고 판단한다.
  - 학원장 권한 또는 봉인 인장으로 특별 관찰 대상 지정이 내려온다.
  - 귀족반/파벌이 이 기록을 알게 될 것이라는 외부 압박을 심는다.

choice:
  variable: choice_final_response
  options:
    - text: "일단 시키는 대로 하겠습니다."
      value: comply
      actual_intent: 상황을 키우지 않으려는 순응.
      outside_interpretation: 자신의 위치를 계산하고 조용히 받아들인다.
      effects:
        - reputation += 1
        - misunderstanding_score += 1
    - text: "저는 정말 아무것도 모릅니다."
      value: deny_knowledge
      actual_intent: 오해를 풀려는 솔직한 설명.
      outside_interpretation: 정보 공개 범위를 제한하는 위험 인물.
      effects:
        - harin_suspicion += 1
        - harin_trust += 1
    - text: "하린 씨가 봐주시면 안 되나요?"
      value: ask_harin_help
      actual_intent: 가장 말이 통하는 사람에게 도움 요청.
      outside_interpretation: 감찰 담당을 자기 편으로 끌어들이는 협상.
      effects:
        - harin_trust += 1
        - rival_pressure += 1

asset_needs:
  minimum:
    - bg_report_room_or_headmaster_seal
    - sprite_harin_neutral
    - sprite_harin_suspicious
    - cg_special_observation_seal
  optional:
    - sfx_document_stamp
    - sfx_distant_bell
    - bgm_academy_tension

misunderstanding_rule: >
  공식 문서는 주인공의 실제 의도보다 결과를 우선 기록한다. 코미디는 주인공의 속마음과
  딱딱한 공문 언어의 간극에서 나오고, 장면의 결과는 진지한 감시 체계로 남는다.

tone_guardrails:
  - 하린이 너무 빨리 호감으로 넘어가지 않게 한다.
  - 주인공의 무지는 웃기지만, 학원 입장에서는 실제 위험으로 보이게 한다.
  - 학원장/파벌 압박은 과장 개그가 아니라 다음 갈등의 씨앗으로 둔다.

next_hook:
  label: ch01_s04_harin_watch
  summary: 하린이 주인공의 임시 감시를 맡고, 두 사람이 학원 복도를 지나며 관계 축을 만든다.
